<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
   <form>
    <h1>Temperature Converter</h1>
    <input type="number" id="textbox" placeholder="Enter Temperature:">

   
    <div class="radio-group">
        <input type="radio" id="toFahrenheit" name="unit">
        <label for="toFahrenheit">Celsius to Fahrenheit</label>
    </div>

    
    <div class="radio-group">
        <input type="radio" id="toCelsius" name="unit">
        <label for="toCelsius">Fahrenheit to Celsius</label>
    </div>


    <div class="radio-group">
        <input type="radio" id="toKelvin" name="unit">
        <label for="toCelsius">Celsius to Kelvin</label>
    </div>

    <button type="button" onclick="convert()">Check!</button>
    <p id="result">Select a Unit</p>
</form>


    <script src="./script.js"></script>
</body>
</html>
